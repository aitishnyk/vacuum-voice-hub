name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[review-signing]' pytest
      - name: Unit tests
        run: pytest -q
      - name: Model matrix audit
        run: python scripts/model_matrix_audit.py
      - name: v1.0 stable software audit (not hardware validation)
        run: python scripts/stable_release_audit.py
      - name: Python compile
        run: python -m compileall -q vacuum_voice_hub
      - name: CLI smoke
        run: |
          vvh --version
          vvh stats
      - name: macOS installer shell syntax
        run: bash -n scripts/INSTALL_MACOS.command
      - name: Web UI JavaScript syntax
        run: python scripts/check_web_js.py
