name: Desktop Packages
on:
  workflow_dispatch:
  pull_request:
    paths: ["vacuum_voice_hub/**", "pyproject.toml", "scripts/build_desktop.py", "scripts/build_codec.sh", "scripts/fetch_codec_sources.py", ".github/workflows/desktop.yml"]
  push:
    tags: ["v2.1.*"]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install build dependencies
        run: python -m pip install ".[desktop,security,review-signing]" pyinstaller
      - name: Fetch pinned redistributable codec sources
        run: python scripts/fetch_codec_sources.py --output work/codec-source
      - name: Build LGPL codec without nonfree components
        run: sh scripts/build_codec.sh work/codec-source > work/codec-build.log 2>&1
      - name: Build environment SBOM and notices
        run: python scripts/build_sbom.py --output work/SBOM.json --notices work/codec-source/NOTICES
      - name: Build native unsigned application
        shell: bash
        run: |
          export VVH_FFMPEG="$PWD/work/codec-source/runtime/bin/ffmpeg"
          export VVH_CODEC_NOTICES="$PWD/work/codec-source/NOTICES"
          python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: VacuumVoiceHub-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.json
            work/codec-source/VacuumVoiceHub-codec-sources.tar.gz
            work/SBOM.json
          if-no-files-found: error
# Windows packaging remains unverified until a native toolchain and
# redistributable codec pass the same acceptance. Builds do not auto-publish.
