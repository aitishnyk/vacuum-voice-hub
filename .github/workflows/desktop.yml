name: Desktop Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vacuum_voice_hub/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macOS
          - os: windows-latest
            artifact: Windows
          - os: ubuntu-latest
            artifact: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install build dependencies
        run: python -m pip install ".[desktop,security]" pyinstaller
      - name: Build desktop executable
        shell: bash
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name VacuumVoiceHub
          --collect-data vacuum_voice_hub
          --collect-all miio
          --collect-all imageio_ffmpeg
          --collect-all webview
          vacuum_voice_hub/desktop.py
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: VacuumVoiceHub-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
