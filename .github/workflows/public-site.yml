name: Public Site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "catalog/**"
      - "vacuum_voice_hub/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/public-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Build public catalog
        run: vvh site build --output public
      - name: Verify public catalog
        run: vvh site verify public
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          html=Path("public/index.html").read_text()
          blocks=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",html,flags=re.I|re.S)
          assert blocks
          with tempfile.TemporaryDirectory() as td:
              for i,src in enumerate(blocks):
                  p=Path(td)/f"site-{i}.js";p.write_text(src)
                  subprocess.run(["node","--check",str(p)],check=True)
          PY
      - name: Upload public-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: VacuumVoiceHub-Public-Site
          path: public/
          if-no-files-found: error

      - name: Check out published branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Publish generated site without rewriting history
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rsync -a --delete --exclude=.git public/ published/
          touch published/.nojekyll
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Publish catalog from $GITHUB_SHA"
            git push origin gh-pages
          fi
