name: Bug report
description: Report a reproducible problem without private data
body:
  - type: textarea
    id: environment
    attributes:
      label: Version, OS and architecture
      description: Include artifact name and signing status; exclude local user paths.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Never attach robot tokens, IP/MAC addresses or private recordings.
    validations:
      required: true
