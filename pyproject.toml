[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vacuum-voice-hub"
version = "0.15.0"
description = "Robot-vacuum voice platform with 215 model profiles, 18-language scripts, offline Piper, translation overlays, audio QA, Creator Studio batch builds, preflight QA, compressed audio QA and language coverage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vacuum Voice Hub contributors"}]
dependencies = [
  "python-miio>=0.5.12",
  "imageio-ffmpeg>=0.6.0"
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0", "keyring>=25.0"]
security = ["keyring>=25.0"]

[project.scripts]
vvh = "vacuum_voice_hub.cli:main"
vvh-desktop = "vacuum_voice_hub.desktop:main"

[tool.setuptools.packages.find]
include = ["vacuum_voice_hub*"]

[tool.setuptools.package-data]
vacuum_voice_hub = ["web/*", "data/*.json", "site/*"]
